name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore ShopFlow.sln
      - name: Build
        run: dotnet build ShopFlow.sln --no-restore -c Release
      - name: Test
        run: dotnet test ShopFlow.sln --no-build -c Release --collect:"XPlat Code Coverage"
